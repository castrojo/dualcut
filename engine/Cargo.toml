[package]
name = "dualcut-engine"
version = "0.27.1"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.103"
cairo-rs = { version = "0.22", features = ["png"], optional = true }
gst-plugin-gtk4 = { version = "0.15.2", optional = true }
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-base = "0.25.3"
gstreamer-controller = "0.25.2"
gstreamer-editing-services = "0.25.2"
gstreamer-pbutils = "0.25.2"
gtk4 = { version = "0.11.4", optional = true }
image = { version = "0.25.10", optional = true }
libadwaita = { features = ["v1_8"],  version = "0.9.2", optional = true }
pango = { version = "0.22.8", optional = true } # keep <0.22.9 until the serde pin below is lifted: pango-sys 0.22.9 pulls system-deps 9 -> serde_core/serde_derive 1.0.225, which conflicts with serde =1.0.219 (see renovate.json)
pangocairo = { version = "0.22.8", optional = true }
pollster = { version = "1.0.1", optional = true }
rustyscript = { version = "0.12.3", optional = true } # 0.12.3 is latest; its deno_core/deno_crypto/swc_ecma_* stack transitively pins rsa 0.9.10 (CVE-2023-49092 Marvin attack, no fixed 0.9.x — only an unreleased 0.10.0-rc exists), rand 0.8.5 (RUSTSEC-2026-0097), and unmaintained bincode/smartstring/unic-* (RUSTSEC-2025-00xx series, pulled in via deno_core -> deno_url -> urlpattern) — no newer rustyscript release resolves any of them. `scripting` is compiled into the shipped Flatpak (ci.yml, flatpak.yml: --features preview,scripting,vector), so this is live, not dormant. Realistic exposure is a malicious project's edit() script reaching WebCrypto RSA via deno_crypto, not a network attacker — the HTTP agent API (api.rs) binds 127.0.0.1 only. See #82.
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1.0.120"
tempfile = "3.12.0"
tiny_http = "0.12.0"
url = "2.5.8"
vello = { version = "0.11.0", optional = true }

[features]
preview = ["dep:gtk4", "dep:libadwaita", "dep:gst-plugin-gtk4", "dep:image", "karaoke"]
scripting = ["dep:rustyscript"]
vector = ["dep:vello", "dep:pollster", "dep:image"]
karaoke = ["dep:cairo-rs", "dep:pango", "dep:pangocairo", "dep:image"]

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "preview"
path = "src/bin/preview/main.rs"
required-features = ["preview"]

[[bin]]
name = "script"
path = "src/bin/script.rs"
required-features = ["scripting"]

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[[bin]]
name = "vello_spike"
path = "src/bin/vello_spike.rs"
required-features = ["vector"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
