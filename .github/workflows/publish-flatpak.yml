name: Publish Flatpak (tuna-os remote)

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps dualcut's own
# trigger policy and its one piece of real variance: generating offline
# cargo sources before the flatpak-builder build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: org.tunaos.dualcut
      manifest-path: engine/build-aux/org.tunaos.dualcut.json
      repo-name: tuna-os/dualcut
      generate-cargo-sources: true
      cargo-lock-path: engine/Cargo.lock
      cargo-sources-output: engine/build-aux/cargo-sources.json
    secrets: inherit
