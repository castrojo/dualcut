name: Publish Flatpak (tuna-os remote)

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This repository pins that privileged
# dependency and commits cargo-sources.json so release builds never execute a
# mutable generator.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@e40806e92d94ddb2a5e9198945fd849e3b929eca
    with:
      app-id: org.tunaos.dualcut
      manifest-path: engine/build-aux/org.tunaos.dualcut.json
      repo-name: tuna-os/dualcut
    secrets:
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
